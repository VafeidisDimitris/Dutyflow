<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}</style>
<script>
  // Βαρδιολόγιο: έκδοση για GitHub Pages με αποθήκευση σε Google Sheet.
  window.VARDIOLOGIO_REMOTE = true;
  // Προαιρετικά: βάλε εδώ τη διεύθυνση του Apps Script (…/exec) για να μη ζητείται στη σύνδεση.
  window.VARDIOLOGIO_API = "https://script.google.com/macros/s/AKfycbxz6z_6OoNP9otRMeBlWl7nVBKIiz9aayUrHDYn_WxfYN5DuB6jG_x7SfELk30mJQkm/exec";
</script>
</head>
<body>
<title>Βαρδιολόγιο</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#EDEDED; --surface:#FFFFFF; --surface-2:#F7F7F7; --surface-3:#EDEDED;
  --ink:#181818; --ink-2:#3B3B3B; --muted:#787878; --line:#DBDBDB; --line-2:#C7C7C7;
  --accent:#00AD74; --accent-soft:#DDF8EC; --accent-ink:#FFFFFF; --accent-text:#00875A;
  --danger:#D63B3B; --danger-soft:#FBE6E6; --warn:#B56F00; --warn-soft:#FCF1DE; --ok:#00875A; --ok-soft:#DDF8EC;
  --wkend:#E6F8F0; --hol:#FDF1DC; --holmark:#E09A1F; --prev:#F7F7F7;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.08);
  --f-ui:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#181818; --surface:#242424; --surface-2:#2A2A2A; --surface-3:#3B3B3B;
    --ink:#F7F7F7; --ink-2:#C7C7C7; --muted:#919191; --line:#303030; --line-2:#3B3B3B;
    --accent:#1DCF8E; --accent-soft:#143A2C; --accent-ink:#181818; --accent-text:#5AE4AA;
    --danger:#FF6B6B; --danger-soft:#3A1F1F; --warn:#F2B45A; --warn-soft:#3A2E1A; --ok:#5AE4AA; --ok-soft:#143A2C;
    --wkend:#243A30; --hol:#3A3020; --holmark:#F2B45A; --prev:#1E1E1E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#181818; --surface:#242424; --surface-2:#2A2A2A; --surface-3:#3B3B3B;
  --ink:#F7F7F7; --ink-2:#C7C7C7; --muted:#919191; --line:#303030; --line-2:#3B3B3B;
  --accent:#1DCF8E; --accent-soft:#143A2C; --accent-ink:#181818; --accent-text:#5AE4AA;
  --danger:#FF6B6B; --danger-soft:#3A1F1F; --warn:#F2B45A; --warn-soft:#3A2E1A; --ok:#5AE4AA; --ok-soft:#143A2C;
  --wkend:#243A30; --hol:#3A3020; --holmark:#F2B45A; --prev:#1E1E1E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}

/* ---- top bar ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.brand h1::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--accent);box-shadow:6px 6px 0 -2px var(--accent-soft)}
.brand small{color:var(--muted);font-size:12px}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav .lbl{min-width:150px;text-align:center;font-weight:600;font-size:15px}
.save{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px 10px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;margin-left:6px;padding:1px 6px;border-radius:10px;background:var(--danger-soft);color:var(--danger)}

main{padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1500px;margin:0 auto}
main>*{min-width:0}
.card{min-width:0}

/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.icon{padding:6px 9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{width:72px}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line-2);border-radius:6px;background:none;cursor:pointer}
label.f{display:grid;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.seg.tiny button{padding:3px 8px;font-size:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card>.hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.card>.hd h2{font-size:15px;font-weight:600}
.card>.hd .sub{color:var(--muted);font-size:12px}
.card>.bd{padding:14px}
.help{color:var(--muted);font-size:12.5px;max-width:70ch}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 6px;border-radius:5px;font-family:var(--f-mono);font-weight:700;font-size:12px}

/* ---- roster grid ---- */
.gridwrap{overflow-x:auto;border-radius:0 0 10px 10px}
table.roster{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:100%}
.roster th,.roster td{padding:0;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.roster thead th{background:var(--surface);position:sticky;top:0;z-index:2}
.roster .lab{position:sticky;left:0;z-index:3;background:var(--surface);text-align:left;padding:0 10px;min-width:118px;max-width:150px;white-space:nowrap;font-weight:600;font-size:12.5px;border-right:1px solid var(--line-2)}
.roster thead .lab{z-index:4}
.roster .dh{width:40px;min-width:40px;padding:5px 0 4px;line-height:1.15}
.roster .dh b{display:block;font-family:var(--f-mono);font-size:13px}
.roster .dh span{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.roster thead .we span,.roster thead .we b{color:var(--accent-text);font-weight:700}
.roster .ho,.roster thead .ho{background:var(--hol)}
.roster thead .ho b{position:relative}
.roster thead .ho span{color:var(--holmark);font-weight:700}
.roster thead .ho::after{content:"";position:absolute;left:50%;bottom:2px;width:14px;height:2px;margin-left:-7px;border-radius:1px;background:var(--holmark)}
.roster thead th.dh{position:sticky}
.roster .wk{border-left:3px solid var(--bg)}
.roster .lvc.sp{background:transparent!important;color:var(--accent-text)!important;box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.roster td.c .v.spec{border:1.5px dashed var(--accent);color:var(--accent-text);font-size:10px}
.roster .pv{background:var(--prev);opacity:.7}
.roster .today b{color:var(--accent-text)}
.roster td.c{height:34px;cursor:pointer;position:relative}
.roster td.c .v{position:absolute;inset:3px;display:flex;align-items:center;justify-content:center;border-radius:5px;font-family:var(--f-mono);font-weight:700;font-size:12.5px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.18)}
.roster td.c .v.empty{border:1.5px dashed var(--line-2);color:var(--muted);font-weight:500}
.roster td.c .v.leave{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 6px);color:var(--ink-2);font-size:10.5px}
.roster td.c:hover .v{box-shadow:0 0 0 2px var(--accent)}
.roster td.c.sel .v{box-shadow:0 0 0 2px var(--accent),0 0 0 4px var(--accent-soft)}
.roster td.c.bad .v{box-shadow:0 0 0 2px var(--danger)}
.roster td.c.soft .v::after{content:"";position:absolute;top:-2px;right:-2px;width:7px;height:7px;border-radius:50%;background:var(--warn);border:1.5px solid var(--surface)}
.roster td.c.bad .v::after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:1.5px solid var(--surface)}
.roster .lk{position:absolute;left:2px;bottom:1px;font-size:9px;line-height:1;opacity:.85}
.roster .lvrow td{height:auto;padding:3px 1px;vertical-align:top}
.roster .lvrow .lvc{display:block;margin:1px auto;width:34px;border-radius:4px;font-family:var(--f-mono);font-size:10.5px;font-weight:700;color:#fff;padding:1px 0}
.roster .sum{min-width:56px;padding:0 8px;font-family:var(--f-mono);font-size:12px;background:var(--surface-2)}
.roster .sum.hd{font-family:var(--f-ui);font-size:11px;color:var(--muted);font-weight:600}
.roster .sepr td,.roster .sepr th{border-top:2px solid var(--line-2)}
.shiftlab{display:flex;align-items:center;gap:8px}
.shiftlab i{width:4px;height:18px;border-radius:2px;display:inline-block}
.shiftlab small{color:var(--muted);font-weight:500;font-family:var(--f-mono);font-size:10.5px}

.emptybanner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:var(--accent-soft);color:var(--ink);border-bottom:1px solid var(--line)}

/* ---- layout for schedule page ---- */
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.issues{list-style:none;margin:0;padding:0;display:grid}
.issues li{display:flex;gap:10px;align-items:flex-start;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.issues li:last-child{border-bottom:0}
.issues li:hover{background:var(--surface-2)}
.issues .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:44px}
.issues .sev{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.issues .sev.h{background:var(--danger)}
.issues .sev.s{background:var(--warn)}
.okmsg{padding:18px 14px;color:var(--ok);font-weight:600}

table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.t th,.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.t th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2)}
.t td.n,.t th.n{text-align:right;font-family:var(--f-mono);font-size:12.5px}
.t tr:last-child td{border-bottom:0}
.twrap{overflow-x:auto}
.meter{position:relative;height:6px;background:var(--surface-3);border-radius:3px;min-width:70px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink-2)}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.dev{font-family:var(--f-mono);font-size:11.5px}
.dev.up{color:var(--warn)} .dev.dn{color:var(--accent-text)}

.errgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.errcat{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);text-align:left;cursor:pointer;font-size:12.5px}
.errcat:disabled{cursor:default}
.errcat .ic{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.errcat .nm{flex:1}
.errcat .ct{font-family:var(--f-mono);font-weight:700}
.errcat.ok .ic{background:var(--ok-soft);color:var(--ok)}
.errcat.ok .nm{color:var(--ink-2)}
.errcat.bad{border-color:var(--danger);background:var(--danger-soft)}
.errcat.bad .ic{background:var(--danger);color:#fff}
.errcat.bad .ct{color:var(--danger)}
.errcat.warn .ic{background:var(--warn);color:#fff}
.errcat.warn .ct{color:var(--warn)}
.errcat.on{box-shadow:0 0 0 2px var(--accent)}
.errfilters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.errp{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 7px 2px 2px;cursor:pointer;font-family:var(--f-mono);font-size:12px;font-weight:700}
.errp.on{box-shadow:0 0 0 2px var(--accent)}
.errgroup+.errgroup{border-top:1px solid var(--line)}
.errgh{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:10px 14px 4px}
.errgh .sev{width:8px;height:8px;border-radius:50%;align-self:center}
.errgh .sev.h{background:var(--danger)} .errgh .sev.s{background:var(--warn)}
.errgh b{font-size:13.5px}
.errgroup .issues li{padding:6px 14px 6px 30px;border-bottom:0}
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:16px}
.card.login{width:min(400px,100%)}
/* ---- drawer ---- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dhd{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.drawer .dhd h3{font-size:16px}
.drawer .dbd{overflow-y:auto;flex:1}
.cand{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.cand:hover{background:var(--surface-2)}
.cand.cur{background:var(--accent-soft)}
.cand .who{display:grid;gap:3px;flex:1;min-width:0}
.cand .who strong{font-size:13.5px}
.cand ul{margin:2px 0 0;padding-left:16px;color:var(--ink-2);font-size:12px}
.cand .tag{font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.ok{color:var(--ok)} .tag.bad{color:var(--danger)} .tag.warn{color:var(--warn)}
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.35);z-index:45}

/* ---- modal ---- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,16,22,.45)}
.modal .box{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(760px,100%);max-height:88vh;overflow:auto;border:1px solid var(--line)}
.modal .box>.hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal .box>.hd h2{font-size:17px}
.modal .box>.bd{padding:16px 18px;display:grid;gap:14px}
.progress{height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.alt{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.alt.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.alt h3{font-size:14px}
.alt dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12.5px}
.alt dt{color:var(--ink-2)} .alt dd{margin:0;font-family:var(--f-mono);text-align:right}

/* ---- staff ---- */
.staffgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media (max-width:420px){.staffgrid{grid-template-columns:1fr}}
.person{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid}
.person .ph{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.person .ph .code{width:64px;font-family:var(--f-mono);font-weight:700;text-align:center}
.person .ph .nm{flex:1}
.person .pb{padding:12px 14px;display:grid;gap:12px}
.person.off{opacity:.6}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv input[type=number]{width:100%}
.avail{border-collapse:collapse;font-size:12px}
.avail th{font-weight:600;color:var(--muted);padding:2px 3px;font-size:11px}
.avail td{padding:2px}
.avail button{width:30px;height:24px;border-radius:5px;border:1px solid var(--line-2);background:var(--ok-soft);color:var(--ok);font-family:var(--f-mono);font-size:11px;font-weight:700;cursor:pointer}
.avail button[data-on="0"]{background:var(--surface-3);color:var(--muted);text-decoration:line-through}
.sh-line{display:flex;align-items:center;gap:8px;justify-content:space-between}
.sh-line span{font-size:12.5px;font-weight:500}

/* ---- rules ---- */
.cov{display:grid;gap:6px}
.covbar{position:relative;height:26px;background:repeating-linear-gradient(90deg,var(--surface-2) 0 calc(100%/24 - 1px),var(--line) calc(100%/24 - 1px) calc(100%/24));border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.covbar i{position:absolute;top:3px;bottom:3px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-mono);font-size:11px;font-weight:700}
.covaxis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.matrix{border-collapse:collapse}
.matrix th,.matrix td{padding:6px 8px;border:1px solid var(--line);text-align:center;font-size:12.5px}
.matrix th{background:var(--surface-2);font-weight:600}
.matrix td label{display:grid;gap:2px;justify-items:center;cursor:pointer}
.matrix td small{color:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.slider{display:grid;grid-template-columns:minmax(150px,1fr) 140px 28px;gap:10px;align-items:center}
.slider output{font-family:var(--f-mono);text-align:right}
@media (max-width:520px){.slider{grid-template-columns:1fr 1fr 24px}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
@media (max-width:420px){.cols{grid-template-columns:1fr}}
.req input{width:40px;padding:4px;text-align:center}

  function runSolver(P, mode, seeds, onProg) {
    return new Promise(function (resolve) {
      var done = false;
      function fallback() {
        if (done) return; done = true;
        setTimeout(function () { resolve(seeds.map(function (sd) { return E.solve(clone(P), { mode: mode, seed: sd, iters: 60000 }); })); }, 30);
      }
      try {
        var src = document.getElementById('engine-src').textContent;
        var url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
        var w = new Worker(url);
        w.onmessage = function (e) {
          if (e.data.type === 'progress') onProg(e.data.frac);
          else if (!done) { done = true; resolve(e.data.results); w.terminate(); }
        };
        w.onerror = function () { w.terminate(); fallback(); };
        w.postMessage({ P: P, mode: mode, seeds: seeds });
      } catch (e) { fallback(); }
    });
  }
  function startGen(mode) {
    ui.sel = null;
    var P = problem();
    ui.gen = { mode: mode, progress: 0, results: null };
    render();
    var seeds = [1, 2, 3].map(function () { return Math.floor(Math.random() * 1e9); });
    runSolver(P, mode, seeds, function (f) {
      ui.gen.progress = f; var b = document.getElementById('genbar'); if (b) b.style.width = Math.round(f * 100) + '%';
    }).then(function (results) {
      if (!ui.gen) return;
      var P2 = problem();
      var out = results.map(function (r) {
        var an = E.analyze(P2, r.asg);
        var dev = 0, nMin = 1e9, nMax = 0, wMin = 1e9, wMax = 0;
        an.per.forEach(function (x, i) {
          if (!P2.active[i]) return;
          dev += Math.abs(x.hours - x.target);
          if (P2.fwN[i] > 0 && staffById(P2.persons[i].id).weeklyTarget >= 30) { nMin = Math.min(nMin, x.nights); nMax = Math.max(nMax, x.nights); }
          if (staffById(P2.persons[i].id).weeklyTarget >= 30) { wMin = Math.min(wMin, x.weekend); wMax = Math.max(wMax, x.weekend); }
        });
        var changes = 0; r.asg.forEach(function (p, i) { if (p !== P2.init[i]) changes++; });
        return { asg: r.asg, cost: an.cost, metrics: {
          hard: an.hard, soft: an.issues.filter(function (x) { return !x.hard && x.d >= 0; }).length,
          hoursDev: Math.round(dev), nights: nMin > nMax ? '—' : nMin + '–' + nMax, weekend: wMin > wMax ? '—' : wMin + '–' + wMax, changes: changes
        } };
      });
      out.sort(function (a, b) { return a.metrics.hard - b.metrics.hard || a.cost - b.cost; });
      // drop duplicates
      var seen = {}; out = out.filter(function (r) { var k = r.asg.join(','); if (seen[k]) return false; seen[k] = 1; return true; });
      ui.gen.results = out; render();
    });
  }

  // ---------- actions ----------
  function setCell(d, sid, k, pIdx) {
    var P = problem();
    pushUndo('αλλαγή βάρδιας');
    var doc = ensureMonth(P.key), key = (d + 1) + '|' + sid, arr = (doc.cells[key] || []).slice();
    while (arr.length <= k) arr.push(null);
    var newId = pIdx >= 0 ? P.persons[pIdx].id : null;
    if (newId) {
      // remove from any other shift the same day
      store.cfg.shifts.forEach(function (s) {
        var kk = (d + 1) + '|' + s.id, a = doc.cells[kk];
        if (!a || kk === key) return;
        var i = a.indexOf(newId); if (i >= 0) a[i] = null;
      });
      var j = arr.indexOf(newId); if (j >= 0 && j !== k) arr[j] = null;
    }
    arr[k] = newId;
    doc.cells[key] = arr;
    trimDoc(doc);
    markMonth(P.key);
  }
  function trimDoc(doc) {
    Object.keys(doc.cells).forEach(function (k) {
      var a = doc.cells[k]; while (a.length && a[a.length - 1] == null) a.pop(); if (!a.length) delete doc.cells[k];
    });
  }
  function setPersonDay(pid, d, sid) {
    var P = problem();
    pushUndo('αλλαγή βάρδιας');
    var doc = ensureMonth(P.key), displaced = null;
    store.cfg.shifts.forEach(function (s) {
      var a = doc.cells[(d + 1) + '|' + s.id]; if (!a) return;
      for (var i = 0; i < a.length; i++) if (a[i] === pid) a[i] = null;
    });
    if (sid) {
      var sh = shiftById(sid), req = reqFor(sh, E.dowOf(ui.y, ui.m, d + 1)), key = (d + 1) + '|' + sid;
      var a = doc.cells[key] = doc.cells[key] || [];
      var slot = -1;
      for (var i = 0; i < Math.max(req, a.length); i++) if (!a[i]) { slot = i; break; }
      if (slot < 0) { slot = 0; displaced = a[0]; }
      while (a.length <= slot) a.push(null);
      a[slot] = pid;
    }
    trimDoc(doc); markMonth(P.key);
    if (displaced) { var st = staffById(displaced); toast((st ? st.code : 'Κάποιος') + ' αφαιρέθηκε από τη βάρδια και έμεινε ρεπό'); }

      ws.getColumn(1).width = 22; for (var cI = 2; cI <= P.D + 1; cI++) ws.getColumn(cI).width = 5.2;
      ws.views = [{ state: 'frozen', xSplit: 1, ySplit: 3 }];

      var wp = wb.addWorksheet('Ανά άτομο');
      wp.addRow([title]); wp.getRow(1).font = { bold: true, size: 14 };
      var hr = ['Άτομο']; for (var d4 = 0; d4 < P.D; d4++) hr.push((d4 + 1) + ' ' + WD[P.dow[d4]]); hr.push('Ώρες', 'Στόχος', 'Νύχτες', 'ΣΚ', 'Αργίες');
      var H = wp.addRow(hr); H.eachCell(function (c) { c.font = { bold: true }; c.border = border; c.alignment = { horizontal: 'center', wrapText: true }; });
      P.persons.forEach(function (p, pi) {
        var st = staffById(p.id), x = an.per[pi]; if (!P.active[pi] && !x.hours) return;
        var row = [st.code + (st.name ? ' ' + st.name : '')], cols = [];
        for (var d5 = 0; d5 < P.D; d5++) {
          var sh = null; P.cellsByDay[d5].forEach(function (c) { if (P.init[c] === pi) sh = store.cfg.shifts[P.cells[c].s]; });
          var lv = P.leave[pi * P.D + d5];
          row.push(sh ? sh.code : (lv && lv !== 3 ? leaveAbbr(P.leaveName[pi * P.D + d5]) : '')); cols.push(sh ? sh.color : null);
        }
        row.push(x.hours, Math.round(x.target), x.nights, x.weekend, x.holiday);

        R2.eachCell(function (c) { c.border = border; c.alignment = { horizontal: 'center' }; });

        cols.forEach(function (col, i) { if (col) { var c = R2.getCell(i + 2); c.fill = fill(col); c.font = fontOn(col); } });
      });
      wp.getColumn(1).width = 24; for (var c2 = 2; c2 <= P.D + 1; c2++) wp.getColumn(c2).width = 5.6;
      wp.views = [{ state: 'frozen', xSplit: 1, ySplit: 2 }];
      return wb.xlsx.writeBuffer();
    }).then(function (buf) {

    }).catch(function () { toast('Δεν φορτώθηκε η βιβλιοθήκη Excel. Δοκίμασε ξανά.'); });
